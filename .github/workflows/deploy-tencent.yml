name: Deploy Tencent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-tencent-production
  cancel-in-progress: false

env:
  # Kept separate from the repository's optional DockerHub publisher.
  DOCKERHUB_IMAGE: ghcr.io/zhangsiqiang07/i-remember.fr
  DEPLOY_HOST: 43.138.80.38

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate deployment scripts
        run: |
          bash -n docker/tencent/deploy-from-actions.sh
          bash -n docker/tencent/run.sh
          sh -n docker/tencent/external-entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable Linux AMD64 application image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/zhangsiqiang07/i-remember.fr
          cache-from: type=gha,scope=tencent-amd64
          cache-to: type=gha,mode=max,scope=tencent-amd64

      - name: Check the built image
        env:
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          image="$DOCKERHUB_IMAGE@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          docker run --rm --entrypoint node "$image" --check server.mjs
          docker run --rm --entrypoint node "$image" --check apps/api/dist/server.js
          # Docker builds already run TypeScript and Vite compilation.
          # Host PostgreSQL readiness/migrations and HTTPS are checked during deployment.

      - name: Deploy through the restricted SSH key
        id: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_DEPLOY_SSH_KEY }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_SSH_KEY" ]]; then
            echo 'Missing repository secret TENCENT_DEPLOY_SSH_KEY' >&2
            exit 1
          fi
          # Do not deploy a queued commit after main has moved forward.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded commit $GITHUB_SHA"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -d -m 700 "$RUNNER_TEMP/remember-ssh"
          key="$RUNNER_TEMP/remember-ssh/key"
          archive="$RUNNER_TEMP/remember-ssh/image.tar"
          manifest="$RUNNER_TEMP/remember-ssh/manifest.json"
          trap 'rm -f "$key" "$archive" "$manifest"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          # Pin the host key read from the server over the existing trusted SSH connection.
          printf '%s\n' '43.138.80.38 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGru5PSdwDuNoRfFf7a9/cIaDkPfGaEyy4xiEEWDeiBN' > "$RUNNER_TEMP/remember-ssh/known_hosts"
          image_ref="$DOCKERHUB_IMAGE@$IMAGE_DIGEST"
          image_id=$(docker image inspect --format '{{.Id}}' "$image_ref")
          docker save "$image_id" > "$archive"
          docker buildx imagetools inspect --raw "$image_ref" > "$manifest"
          manifest_b64=$(python3 - "$manifest" "$IMAGE_DIGEST" "$image_id" <<'PYTHON'
          import base64, hashlib, json, sys
          raw = open(sys.argv[1], 'rb').read()
          if 'sha256:' + hashlib.sha256(raw).hexdigest() != sys.argv[2]:
              raw = raw.rstrip(b'\n')
          assert 'sha256:' + hashlib.sha256(raw).hexdigest() == sys.argv[2], 'Registry digest mismatch'
          assert json.loads(raw)['config']['digest'] == sys.argv[3], 'Registry image ID mismatch'
          print(base64.b64encode(raw).decode())
          PYTHON
          )
          checksum=$(sha256sum "$archive" | cut -d' ' -f1)
          size=$(stat -c %s "$archive")
          export RSYNC_RSH="ssh -T -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile=$RUNNER_TEMP/remember-ssh/known_hosts"
          for attempt in 1 2 3; do
            if rsync --partial --checksum --compress --no-whole-file --protocol=31 --timeout=180 --stats \
              --rsync-path="upload $GITHUB_SHA $IMAGE_DIGEST" "$archive" "root@$DEPLOY_HOST:image.tar"; then
              break
            else
              result=$?
              # Resume interrupted transfers only; image/app verification failures stay fatal.
              if [[ ! "$result" =~ ^(10|12|30|35|255)$ || "$attempt" == 3 ]]; then exit "$result"; fi
              sleep "$((attempt * 10))"
            fi
          done
          printf 'cached-image-v1 %s %s %s %s\n' "$image_id" "$checksum" "$size" "$manifest_b64" | \
            ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              -o "UserKnownHostsFile=$RUNNER_TEMP/remember-ssh/known_hosts" \
              "root@$DEPLOY_HOST" "deploy $GITHUB_SHA $IMAGE_DIGEST"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Verify public HTTPS
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 https://remember.aflyblue.cn/readyz
          curl --fail --silent --show-error https://remember.aflyblue.cn/version
          curl --fail --silent --show-error -o /dev/null https://remember.aflyblue.cn/admin
          printf '### Deployment\n\n- Commit: `%s`\n- Site: https://remember.aflyblue.cn\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
