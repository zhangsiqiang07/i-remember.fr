name: Verify source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          sh -n docker/single-entrypoint.sh
          sh -n docker/healthcheck.sh
          sh -n docker/backup.sh
          sh -n docker/restore.sh
          bash -n docker/ci-smoke.sh
          bash -n docker/tencent/deploy-from-actions.sh
          python3 docker/tencent/check-receive-image.py
          python3 docker/tencent/check-rsync-transfer.py
          TAG=sha-000000000000 docker compose config --quiet

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install media and database test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl libheif-examples postgresql libpq-dev

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Reject high or critical production advisories
        run: pnpm audit --prod --audit-level=high

      - name: Build pull-request image
        if: github.event_name == 'pull_request'
        run: docker build --tag i-remember:pull-request-smoke .

      - name: Verify pull-request container lifecycle
        if: github.event_name == 'pull_request'
        run: bash docker/ci-smoke.sh i-remember:pull-request-smoke

